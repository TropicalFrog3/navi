<div style="background: #1e2024; border: 1px solid #3d4450; border-radius: 6px; padding: 18px 22px; width: 680px; max-width:calc(100% - 32px); max-height: 85vh; max-height: calc(100vh - 40px); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6); font-family: 'Motiva Sans', sans-serif; color: #dcdedf; box-sizing: border-box;" id="sls-modal-card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-shrink:0;">
        <div>
            <h2 style="margin:0; font-size:20px; font-weight:300; color: #fff; text-transform: uppercase; letter-spacing: 1px;">Lua download provider</h2>
            <p style="margin:4px 0 0;font-size:13px;color:#969696;">AppID: {{APPID}}</p>
        </div>
        <button id="sls-provider-close" class="sls-btn-close Focusable" tabindex="-1" role="button" aria-label="Close">&times;</button>
    </div>
    <div id="sls-provider-rows" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 6px; padding-left: 2px; padding-top: 2px; padding-bottom: 2px; display: flex; flex-direction: column; gap: 6px; overscroll-behavior: contain;">
        {{PROVIDER_ROWS}}
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-shrink:0;">
        <button id="sls-clear-app-cache" class="sls-btn-action Focusable" tabindex="-1" role="button" style="flex:1;height:40px;font-size:14px;">Clear App Cache</button>
        <button id="sls-clear-all-cache" class="sls-btn-action Focusable" tabindex="-1" role="button" style="flex:1;height:40px;font-size:14px;">Clear All Cache</button>
        <button id="sls-auto-search" class="sls-btn-action Focusable" tabindex="-1" role="button" style="flex:1;height:40px;font-size:14px;background:#06bfff;color:#fff;">Auto Download</button>
    </div>
</div>
