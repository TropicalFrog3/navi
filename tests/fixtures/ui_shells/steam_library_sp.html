                manageBtn.__reactFiber$testMock = mockFiber;

            }

            // Mock React Router history on SuperNav container for import-lua-script
            var superNav = document.querySelector('._2D64jIEK7wpUR_NlObDW76');
            if (superNav) {
                var listeners = [];
                var mockHistory = {
                    listen: function(cb) {
                        listeners.push(cb);
                        return function() {
                            var idx = listeners.indexOf(cb);
                            if (idx >= 0) listeners.splice(idx, 1);
                        };
                    },
                    push: function(path) {
                        listeners.forEach(function(cb) { cb({ pathname: path }); });
                    }
                };
                superNav.__reactFiber$superNav = {
                    memoizedProps: {
                        history: mockHistory
                    },
                    return: null
                };
            }

            // Mock Steam collectionStore and appStore for auto-collection.js
            window.collectionStore = {
                userCollections: [],
                m_mapCollectionsFromStorage: new Map(),
                GetUserCollectionsByName: function(name) {
                    return this.userCollections.filter(function(c) { return c.name === name; });
                },
                NewUnsavedCollection: function(name, filter, appIds) {
                    return {
                        id: 'col_' + Math.random().toString(36).slice(2),
                        name: name,
                        apps: (appIds || []).slice()
                    };
                },
                SaveCollection: function(col) {
                    if (!this.userCollections.includes(col)) {
                        this.userCollections.push(col);
                    }
                    this.m_mapCollectionsFromStorage.set(col.id, col);
                },
                AddOrRemoveApp: function(appIds, isAdd, colId) {
                    var col = this.userCollections.find(function(c) { return c.id === colId; });
                    if (col) {
                        if (isAdd) {
                            appIds.forEach(function(id) {
                                if (!col.apps.includes(id)) col.apps.push(id);
                            });
                        } else {
                            col.apps = col.apps.filter(function(id) { return !appIds.includes(id); });
                        }
                    }
                }
            };

            window.appStore = {
                GetAppOverviewByAppID: function(appId) {
                    if (Number(appId) === 9999999) return null;
                    return { appid: Number(appId), display_name: "Game " + appId };
                }
            };

            // Setup debounced library search
            var searchInput = document.getElementById('library-search-input');
            var emptyState = document.getElementById('library-empty-search-state');
            var searchDebounceTimer = null;
            var latestSearchQuerySeq = 0;

            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    clearTimeout(searchDebounceTimer);
                    var currentSeq = ++latestSearchQuerySeq;
                    searchDebounceTimer = setTimeout(function() {
                        if (currentSeq !== latestSearchQuerySeq) return; // Out-of-order protection
                        var q = searchInput.value.trim().toLowerCase();
                        var items = document.querySelectorAll('#library-items-list .sidebar-item');
                        var visibleCount = 0;
                        items.forEach(function(el) {
                            var title = (el.getAttribute('data-game-title') || el.textContent || '').toLowerCase();
                            var matches = !q || title.indexOf(q) !== -1;
                            el.style.display = matches ? 'flex' : 'none';
                            if (matches) visibleCount++;
                        });
                        if (emptyState) {
                            emptyState.style.display = (visibleCount === 0 && q) ? 'block' : 'none';
                        }
                    }, 50);
                });
            }
        })();
